<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Media Player</title>
</head>
<body>
    
        <h1>HTML Media Player</h1>
    
    
        <p><b>This is the image content of page.</b></p>
        <img src="testing-img-1.jpg" alt="Set of books" width="1000">


        <p><b>This is the video content of page.</b></p>
        <video width="1000" controls>
            <source src="testing-vid-1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <p><b>This is the audio content of page.</b></p>
        <p>Song: There Is a Light That Never Goes Out</p>
        <audio controls>
            <source src="testing-audio-1.mp3" type="audio/mpeg">
        </audio>
    
</body>
</html>
